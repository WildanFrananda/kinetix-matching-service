syntax = "proto3";

package fulfillment.v1;

import "common/v1/types.proto";
import "common/v1/enums.proto";

option go_package = "fulfillment/v1;fulfillmentv1";
option ruby_package = "Fulfillment::V1";

service FulfillmentService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrderStatus (GetOrderStatusRequest) returns (GetOrderStatusResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
}

message CreateOrderRequest {
  string merchant_api_key = 1;
  string order_number = 2;
  common.v1.Address shipping_address = 3;
  common.v1.Money total_amount = 4;
  repeated common.v1.OrderItem items = 5;
}

message CreateOrderResponse {
  int64 order_id = 1;
  string order_number = 2;
  common.v1.OrderStatus status = 3;
  int64 merchant_id = 4;
  string created_at = 5;
  common.v1.ErrorDetail error = 6;
}

message GetOrderStatusRequest {
  string merchant_api_key = 1;
  int64 order_id = 2;
  string order_number = 3;
}

message GetOrderStatusResponse {
  int64 order_id = 1;
  string order_number = 2;
  common.v1.OrderStatus status = 3;
  string awb_number = 4;
  string pod_photo_url = 5;
  common.v1.GeoPoint driver_location = 6;
  string updated_at = 7;
}

message CancelOrderRequest {
  string merchant_api_key = 1;
  int64 order_id = 2;
  string reason = 3;
}

message CancelOrderResponse {
  bool success = 1;
  string message = 2;
  common.v1.OrderStatus current_status = 3;
}
