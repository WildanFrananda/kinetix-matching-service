syntax = "proto3";

package fulfillment.v1;

import "common/v1/types.proto";

option go_package = "fulfillment/v1;fulfillmentv1";
option ruby_package = "Fulfillment::V1";

service BinStockService {
  rpc CheckBinStock (CheckBinStockRequest) returns (CheckBinStockResponse);
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
}

message CheckBinStockRequest {
  string merchant_api_key = 1;
  string sku = 2;
}

message CheckBinStockResponse {
  string sku = 1;
  string product_name = 2;
  int32 physical_stock = 3;
  int32 allocated_stock = 4;
  int32 available_stock = 5;
  string bin_location = 6;
  bool low_stock_warning = 7;
}

message ReserveStockRequest {
  string merchant_api_key = 1;
  string sku = 2;
  int32 quantity = 3;
  string order_number = 4;
}

message ReserveStockResponse {
  bool success = 1;
  string bin_location = 2;
  int32 remaining_available = 3;
  common.v1.ErrorDetail error = 4;
}
