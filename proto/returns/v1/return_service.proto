syntax = "proto3";

package returns.v1;

import "common/v1/types.proto";
import "common/v1/enums.proto";

option go_package = "returns/v1;returnsv1";
option ruby_package = "Returns::V1";

service ReturnService {
  rpc SubmitReturnClaim (SubmitReturnClaimRequest) returns (SubmitReturnClaimResponse);
  rpc GetReturnStatus (GetReturnStatusRequest) returns (GetReturnStatusResponse);
}

message SubmitReturnClaimRequest {
  string merchant_api_key = 1;
  int64 order_id = 2;
  string order_number = 3;
  string reason = 4;
  repeated string photo_urls = 5;
}

message SubmitReturnClaimResponse {
  int64 return_id = 1;
  common.v1.ReturnStatus status = 2;
  string created_at = 3;
  common.v1.ErrorDetail error = 4;
}

message GetReturnStatusRequest {
  string merchant_api_key = 1;
  int64 return_id = 2;
}

message GetReturnStatusResponse {
  int64 return_id = 1;
  int64 order_id = 2;
  common.v1.ReturnStatus status = 3;
  string reason = 4;
  string resolved_at = 5;
}
