syntax = "proto3";

package common.v1;

option go_package = "common/v1;commonv1";
option ruby_package = "Common::V1";

message Money {
  string currency_code = 1; // e.g. "IDR", "USD"
  int64 units = 2;          // Whole units
  int32 nanos = 3;          // Fractional cents / Rp
}

message GeoPoint {
  double latitude = 1;
  double longitude = 2;
}

message Address {
  string recipient_name = 1;
  string phone_number = 2;
  string street_address = 3;
  string city = 4;
  string postal_code = 5;
  GeoPoint location = 6;
}

message OrderItem {
  string sku = 1;
  string product_name = 2;
  int32 quantity = 3;
  Money price = 4;
  string bin_location = 5;
}

message ErrorDetail {
  string error_code = 1;
  string message = 2;
  repeated string field_violations = 3;
}
